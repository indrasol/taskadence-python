[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taskadence"
dynamic = ["version"]
description = "The official Python SDK for the TasKadence API: a typed client generated from the public OpenAPI, the `tm` command line, and pandas helpers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Indrasol" }]
keywords = ["taskadence", "tasks", "project management", "api", "sdk", "client", "cli", "pandas", "webhooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "typing-extensions>=4.7",
    # required by the generated models (openapi-python-client emits attrs classes and parses dates with dateutil)
    "attrs>=23.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13", "keyring>=24"]
pandas = ["pandas>=2"]
dev = [
    # the generator itself needs Python >= 3.11 (scripts/generate.py runs on 3.12 in CI); the SDK supports 3.10
    "openapi-python-client==0.29.1; python_version >= '3.11'",
    "pytest>=8",
    "respx>=0.21",
    "ruff==0.16.9",
    "mypy>=1.11,<2.4",
    "types-python-dateutil",
    "build>=1.2",
    "twine>=5",
    "pip-audit>=2.7",
    "typer>=0.12",
    "rich>=13",
    "keyring>=24",
    "pandas>=2",
    "pandas-stubs",
]

[project.scripts]
tm = "taskadence.cli:main"
taskadence = "taskadence.cli:main"  # the same CLI under the product's name

[project.urls]
Homepage = "https://taskadence.com"
Documentation = "https://docs.taskadence.com"
Source = "https://github.com/indrasol/taskadence-python"
Issues = "https://github.com/indrasol/taskadence-python/issues"
Changelog = "https://github.com/indrasol/taskadence-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/taskadence/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/taskadence"]

[tool.hatch.build.targets.sdist]
include = ["src/taskadence", "spec", "tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against a live API (TASKADENCE_TOKEN + TASKADENCE_API_URL); skipped without them"]
addopts = "-m 'not integration'"
filterwarnings = ["error::DeprecationWarning:taskadence.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/taskadence/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
    "S101",                         # assert is how pytest speaks (and the facade's internal invariants)
    "RUF001", "RUF002", "RUF003",   # en dashes and ellipses in prose are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]                           # fake tokens and secrets in fixtures
"scripts/*" = ["S603", "S607"]                         # the generator runs the pinned local tools
"src/taskadence/resources.py" = ["E501"]                # generated: docstrings carry the full filter vocabulary
"src/taskadence/_operations.py" = ["E501"]              # generated: one operation per line

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/taskadence"]
# The generated client is checked by its generator, not by us: it is excluded here and every facade call into it
# is typed at the facade's boundary. `follow_imports = silent` still reads its annotations.
exclude = ["src/taskadence/_generated/"]

[[tool.mypy.overrides]]
module = ["taskadence._generated.*"]
follow_imports = "silent"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["keyring.*", "respx.*"]
ignore_missing_imports = true

# pandas is an optional extra, referenced only in annotations; numpy's stubs use 3.12-only syntax, which a
# `python_version = 3.10` check cannot parse. `DataFrame` is therefore `Any` to the type checker.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
