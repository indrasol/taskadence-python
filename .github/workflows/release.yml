# tasksmate-python release (task 4.5 Part E) — BUILT, NOT PUBLISHED (user decision 2026-09-21).
#
# 5.3: one pipeline, three artefacts — the SDK `tasksmate`, the stdio MCP proxy `tasksmate-mcp` (both PyPI; `uvx
# tasksmate-mcp`) and its Node twin `@tasksmate/mcp` (npm; `npx -y @tasksmate/mcp`), all stamped from the same tag.
#
# - A tag `v0.*` (a pre-release; `0.x` carries no compatibility promise) builds, checks, and publishes BOTH Python
#   distributions to TestPyPI through trusted publishing (OIDC: no long-lived token anywhere). npm has no test registry:
#   the tarball is built, checked and kept as an artifact.
# - `workflow_dispatch` with target=testpypi does the same for the current version.
# - target=pypi and target=npm are DISABLED until the stability gate, task S.23: the `gate` job fails with "S.23 gate",
#   and every publish job needs it. Opening the gate is S.23's change to this file (and the registries' setup).
#
# One-time setup outside this repo (owner, at S.23 / first TestPyPI upload): on test.pypi.org add a pending trusted
# publisher for EACH project — `tasksmate` and `tasksmate-mcp` — owner `indrasol`, repo `tasksmate-python`, workflow
# `release.yml`, environment `testpypi`; a GitHub environment `testpypi` (and later `pypi` and `npm`, each with a required
# reviewer). npm: the `@tasksmate` org (scope) must exist and `@tasksmate/mcp` be configured for trusted publishing from
# this workflow — then `npm publish --provenance` (below) needs no token.
name: release

on:
  push:
    tags: ["v0.*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi, npm]
        default: testpypi

permissions:
  contents: read

jobs:
  gate:
    name: S.23 gate
    runs-on: ubuntu-latest
    steps:
      - name: PyPI and npm are closed until S.23
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'pypi' || inputs.target == 'npm')
        run: |
          echo "::error::S.23 gate — publishing to ${{ inputs.target }} is disabled until the stability gate (task S.23). Use target=testpypi."
          exit 1
      - run: echo "target=${{ inputs.target || 'testpypi' }} — allowed"

  build:
    name: build, verify, SBOM (tasksmate, tasksmate-mcp, @tasksmate/mcp)
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stamp the version from the tag (v0.2.0 → 0.2.0) — all three packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in 0.*) ;; *) echo "::error::only 0.x pre-releases are released before S.23 (got $version)"; exit 1 ;; esac
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" src/tasksmate/_version.py packages/tasksmate-mcp/src/tasksmate_mcp/_version.py
          sed -i "s/^export const VERSION = .*/export const VERSION = '$version';/" packages/mcp-node/src/version.ts
          (cd packages/mcp-node && npm version "$version" --no-git-tag-version --allow-same-version)
          grep -H __version__ src/tasksmate/_version.py packages/tasksmate-mcp/src/tasksmate_mcp/_version.py
          grep -H VERSION packages/mcp-node/src/version.ts
      - run: pip install -e ".[dev]" -e "./packages/tasksmate-mcp[dev]" cyclonedx-bom
      - name: The code is what the spec generates
        run: |
          python scripts/generate.py
          git diff --exit-code -- src docs
      - run: pytest
      - run: mypy
      - run: pytest && mypy   # its own pyproject (config, testpaths)
        working-directory: packages/tasksmate-mcp
      - run: python -m build
      - run: python -m build packages/tasksmate-mcp --outdir dist/
      - run: twine check --strict dist/*
      - name: CycloneDX SBOM of each installed wheel (S.2)
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install dist/tasksmate-*.whl
          cyclonedx-py environment /tmp/sbom/bin/python --of JSON -o sbom.cdx.json
          python -m venv /tmp/sbom-mcp
          /tmp/sbom-mcp/bin/pip install dist/tasksmate_mcp-*.whl
          cyclonedx-py environment /tmp/sbom-mcp/bin/python --of JSON -o sbom-tasksmate-mcp.cdx.json
      - name: "@tasksmate/mcp: check, pack, SBOM"
        working-directory: packages/mcp-node
        run: |
          npm ci
          npm run check
          npm audit --audit-level=moderate
          mkdir -p ../../npm-dist
          npm pack --pack-destination ../../npm-dist
          npx --yes @cyclonedx/cyclonedx-npm@6 --omit dev --output-format JSON --output-file ../../sbom-mcp-node.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: npm-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom*.cdx.json

  testpypi:
    name: publish tasksmate + tasksmate-mcp to TestPyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [gate, build]
    if: startsWith(github.ref, 'refs/tags/v0.') || inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tasksmate
    permissions:
      id-token: write   # OIDC for trusted publishing — the only permission it gets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI (closed until S.23)
    runs-on: ubuntu-latest
    needs: [gate, build]
    # Unreachable while `gate` fails on target=pypi. S.23 removes the gate step and keeps this job.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    environment:
      name: pypi
      url: https://pypi.org/p/tasksmate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: publish @tasksmate/mcp to npm (closed until S.23)
    runs-on: ubuntu-latest
    needs: [gate, build]
    # Unreachable while `gate` fails on target=npm — exactly as `pypi`. S.23 removes the gate step and keeps this job.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'npm'
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tasksmate/mcp
    permissions:
      id-token: write   # npm trusted publishing + provenance (`--provenance`): a signed statement of this build
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: npm-dist/
      - run: npm publish npm-dist/*.tgz --access public --provenance
