# taskadence-python release (task 4.5 Part E; S.23a opened PyPI and npm).
#
# 5.3: one pipeline, three artefacts: the SDK `taskadence`, the stdio MCP proxy `taskadence-mcp` (both PyPI; `uvx
# taskadence-mcp`) and its Node twin `@taskadence/mcp` (npm; `npx -y @taskadence/mcp`), all stamped from the same tag.
#
# - A pushed tag `v*` (`v1.0.0`, the first stable release; semver from there) builds, checks, and publishes BOTH
#   Python distributions to TestPyPI through trusted publishing (OIDC: no long-lived token anywhere). Nothing else: npm
#   has no test registry, so the tarball is built, checked and kept as an artifact.
# - `workflow_dispatch` target=testpypi does the same for whatever ref it runs on.
# - S.23 is OPEN: `workflow_dispatch` target=pypi publishes both Python distributions to PyPI, target=npm publishes
#   `@taskadence/mcp` to npm. Both run ONLY from a tag (Run workflow → "Use workflow from" → Tags → `vX.Y.Z`), so the
#   version is always the tag's: the `gate` job fails any other ref. The stamp step takes a plain `X.Y.Z` only.
#
# 5.5: ONE GitHub environment per distribution and registry. PyPI refuses two pending trusted publishers with the same
# (owner, repo, workflow, environment), so each publish job uploads one distribution under its own environment:
#   TestPyPI `taskadence` → `testpypi`   TestPyPI `taskadence-mcp` → `testpypi-mcp`   (no reviewer)
#   PyPI     `taskadence` → `pypi`       PyPI     `taskadence-mcp` → `pypi-mcp`       (required reviewer)
#   npm      `@taskadence/mcp` → `npm`                                                (required reviewer)
# Each trusted publisher names repo `indrasol/taskadence-python`, workflow `release.yml` and that environment.
#
# npm: trusted publishing (OIDC, `id-token: write`) plus `--provenance`; there is no npm token anywhere. npm can only
# attach a trusted publisher to a package that exists, so the FIRST publish of `@taskadence/mcp` is manual, once, by the
# owner (2FA, `--provenance=false`); then the package's Settings → Trusted publisher names this workflow and the `npm`
# environment, and every later version goes through the `npm` job below. Trusted publishing needs npm >= 11.5.1:
# the job runs Node 24.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi, npm]
        default: testpypi

permissions:
  contents: read

jobs:
  gate:
    name: release gate (pypi and npm only from a tag)
    runs-on: ubuntu-latest
    steps:
      - name: PyPI and npm publish only from a v* tag, so the version is the tag's
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'pypi' || inputs.target == 'npm') && !startsWith(github.ref, 'refs/tags/v')
        env:
          TARGET: ${{ inputs.target }}
          REF: ${{ github.ref }}
        run: |
          echo "::error::target=$TARGET runs only from a tag ref refs/tags/v* (got $REF). Run workflow → Use workflow from → Tags → vX.Y.Z."
          exit 1
      - env:
          TARGET: ${{ inputs.target || 'testpypi' }}
          REF: ${{ github.ref }}
        run: echo "target=$TARGET ref=$REF allowed"

  build:
    name: build, verify, SBOM (taskadence, taskadence-mcp, @taskadence/mcp)
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false   # S.19: no cache in a release build (cache poisoning)
      - name: Stamp the version from the tag (v1.0.0 → 1.0.0), all three packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::the tag must be vX.Y.Z (got $version)"; exit 1; }
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" src/taskadence/_version.py packages/taskadence-mcp/src/taskadence_mcp/_version.py
          sed -i "s/^export const VERSION = .*/export const VERSION = '$version';/" packages/mcp-node/src/version.ts
          (cd packages/mcp-node && npm version "$version" --no-git-tag-version --allow-same-version)
          grep -H __version__ src/taskadence/_version.py packages/taskadence-mcp/src/taskadence_mcp/_version.py
          grep -H VERSION packages/mcp-node/src/version.ts
      - run: pip install -e ".[dev]" -e "./packages/taskadence-mcp[dev]" cyclonedx-bom
      - name: The code is what the spec generates
        # The stamp step above has just rewritten _version.py on a tag: that is the release, not drift.
        run: |
          python scripts/generate.py
          git diff --exit-code -- src docs ':(exclude)src/taskadence/_version.py'
      - run: pytest
      - run: mypy
      - run: pytest && mypy   # its own pyproject (config, testpaths)
        working-directory: packages/taskadence-mcp
      # One directory (and one artifact) per distribution: each publish job uploads exactly its own files.
      - run: python -m build --outdir dist/taskadence
      - run: python -m build packages/taskadence-mcp --outdir dist/taskadence-mcp
      - run: twine check --strict dist/taskadence/* dist/taskadence-mcp/*
      - name: CycloneDX SBOM of each installed wheel (S.2)
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install dist/taskadence/taskadence-*.whl
          cyclonedx-py environment /tmp/sbom/bin/python --of JSON -o sbom.cdx.json
          python -m venv /tmp/sbom-mcp
          /tmp/sbom-mcp/bin/pip install dist/taskadence-mcp/taskadence_mcp-*.whl
          cyclonedx-py environment /tmp/sbom-mcp/bin/python --of JSON -o sbom-taskadence-mcp.cdx.json
      - name: "@taskadence/mcp: check, pack, SBOM"
        working-directory: packages/mcp-node
        run: |
          npm ci
          npm run check
          npm audit --audit-level=moderate
          mkdir -p ../../npm-dist
          npm pack --pack-destination ../../npm-dist
          npx --yes @cyclonedx/cyclonedx-npm@6 --omit dev --output-format JSON --output-file ../../sbom-mcp-node.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-taskadence
          path: dist/taskadence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-taskadence-mcp
          path: dist/taskadence-mcp/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dist
          path: npm-dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom*.cdx.json

  testpypi:
    name: publish taskadence to TestPyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [gate, build]
    # A tag push, or target=testpypi. Not a pypi / npm dispatch on a tag: TestPyPI already has that version.
    if: github.event_name == 'push' || inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/taskadence
    permissions:
      id-token: write   # OIDC for trusted publishing — the only permission it gets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-taskadence
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # S.23b: TestPyPI already holds the 0.1.0 rehearsal; moving the v0.1.0 tag must not fail on it. TestPyPI only.
          skip-existing: true

  testpypi-mcp:
    name: publish taskadence-mcp to TestPyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [gate, build]
    if: github.event_name == 'push' || inputs.target == 'testpypi'
    environment:
      name: testpypi-mcp
      url: https://test.pypi.org/p/taskadence-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-taskadence-mcp
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # S.23b: TestPyPI already holds the 0.1.0 rehearsal; moving the v0.1.0 tag must not fail on it. TestPyPI only.
          skip-existing: true

  pypi:
    name: publish taskadence to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [gate, build]
    # From a tag only (`gate` fails any other ref); the `pypi` environment's reviewer approves the upload.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/taskadence
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-taskadence
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  pypi-mcp:
    name: publish taskadence-mcp to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [gate, build]
    # Exactly as `pypi`, under its own environment `pypi-mcp`.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi-mcp
      url: https://pypi.org/p/taskadence-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-taskadence-mcp
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    name: publish @taskadence/mcp to npm (trusted publishing + provenance)
    runs-on: ubuntu-latest
    needs: [gate, build]
    # From a tag only, like `pypi`. Needs the trusted publisher set up after the manual first publish (header).
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'npm' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/@taskadence/mcp
    permissions:
      id-token: write   # npm trusted publishing + provenance (`--provenance`): a signed statement of this build
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"             # bundles npm >= 11.5.1, which trusted publishing needs (Node 22 has npm 10)
          package-manager-cache: false   # S.19: no cache in a release build (cache poisoning)
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: npm-dist/
      - run: npm --version
      - name: Publish (OIDC; no token)
        # `./` is required: npm reads a bare `npm-dist/x.tgz` as GitHub shorthand (user/repo) and runs `git ls-remote`.
        run: npm publish ./npm-dist/*.tgz --provenance --access public
