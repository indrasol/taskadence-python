# taskadence-python CI (task 4.5 Part E). Every job runs offline except `integration`, which runs only when the
# TASKADENCE_TOKEN secret exists. Nothing here publishes anything (that is release.yml: TestPyPI on a tag; PyPI and npm
# by a manual run from a tag, behind environment reviewers).
# 5.3: + the two stdio MCP proxies in packages/ — `taskadence-mcp` (Python, `uvx`) and `@taskadence/mcp` (Node, `npx`).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      # src/taskadence/_generated is excluded (pyproject [tool.mypy]): generated code is its generator's to type-check;
      # every call into it is typed at the facade's boundary.
      - run: mypy

  test:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest   # respx-mocked; `integration` tests are deselected (pyproject addopts)

  regen:
    name: regenerate from spec/openapi.public.json (fails on drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/generate.py
      - name: The committed code is what the committed spec generates
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  mcp-python:
    name: taskadence-mcp — ruff, mypy, pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/taskadence-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest   # a stdio client → the proxy → a fake Streamable HTTP server, in memory; plus the real process

  mcp-node:
    name: "@taskadence/mcp — typecheck, vitest, npm pack (node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: packages/mcp-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/mcp-node/package-lock.json
      - run: npm ci
      - run: npm run check   # tsc --noEmit, build + vitest, npm pack --dry-run
      - run: npm audit --audit-level=moderate

  audit:
    name: pip-audit (runtime + extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --upgrade pip pip-audit
          /tmp/audit/bin/pip install ".[cli,pandas]"
          # taskadence itself is not on PyPI (yet): audit everything it pulls in, pinned as installed
          /tmp/audit/bin/pip freeze --exclude taskadence --exclude pip-audit > /tmp/audit-requirements.txt
          /tmp/audit/bin/pip-audit --strict --desc=off -r /tmp/audit-requirements.txt
      - name: taskadence-mcp's dependencies (mcp, httpx and what they pull in)
        run: |
          python -m venv /tmp/audit-mcp
          /tmp/audit-mcp/bin/pip install --upgrade pip pip-audit
          /tmp/audit-mcp/bin/pip install ./packages/taskadence-mcp
          /tmp/audit-mcp/bin/pip freeze --exclude taskadence-mcp --exclude pip-audit > /tmp/audit-mcp-requirements.txt
          /tmp/audit-mcp/bin/pip-audit --strict --desc=off -r /tmp/audit-mcp-requirements.txt

  build:
    name: build + twine check + SBOM (taskadence, taskadence-mcp, @taskadence/mcp)
    runs-on: ubuntu-latest
    needs: [lint, test, regen, mcp-python, mcp-node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: pip install build twine cyclonedx-bom
      - run: python -m build
      - run: python -m build packages/taskadence-mcp --outdir dist/
      - run: twine check --strict dist/*
      - name: CycloneDX SBOM of each installed wheel (S.2)
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install dist/taskadence-*.whl   # taskadence's wheel; taskadence-mcp's is taskadence_mcp-*.whl
          cyclonedx-py environment /tmp/sbom/bin/python --of JSON -o dist/sbom.cdx.json
          python -m venv /tmp/sbom-mcp
          /tmp/sbom-mcp/bin/pip install dist/taskadence_mcp-*.whl
          cyclonedx-py environment /tmp/sbom-mcp/bin/python --of JSON -o dist/sbom-taskadence-mcp.cdx.json
      - name: npm pack + SBOM (@taskadence/mcp; nothing is published)
        working-directory: packages/mcp-node
        run: |
          npm ci
          npm pack --pack-destination ../../dist
          npx --yes @cyclonedx/cyclonedx-npm@6 --omit dev --output-format JSON --output-file ../../dist/sbom-mcp-node.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 14

  integration:
    name: quickstart against a live API (skipped without the secret)
    runs-on: ubuntu-latest
    needs: [test]
    env:
      TASKADENCE_TOKEN: ${{ secrets.TASKADENCE_TOKEN }}
      TASKADENCE_API_URL: ${{ vars.TASKADENCE_API_URL }}
      TASKADENCE_ORG: ${{ vars.TASKADENCE_ORG }}
    steps:
      - name: Skip when no token is configured
        if: env.TASKADENCE_TOKEN == ''
        run: echo "TASKADENCE_TOKEN is not set for this repository — the integration job is skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: env.TASKADENCE_TOKEN != ''
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.TASKADENCE_TOKEN != ''
        with:
          python-version: "3.12"
      - if: env.TASKADENCE_TOKEN != ''
        run: pip install -e ".[dev]"
      - if: env.TASKADENCE_TOKEN != ''
        run: pytest -m integration -o addopts="" -v

  workflows:
    name: workflows
    # S.19: actionlint (pinned, checksum-verified; shellcheck on run: blocks) then zizmor (workflow security: template
    # injection, unpinned uses, excessive permissions, credential persistence, Dependabot cooldown).
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: zizmor (workflow security)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false   # no code scanning upload (no GitHub Advanced Security on this plan)
          annotations: true

  secrets:
    name: secrets
    # S.1: gitleaks, a pinned and checksum-verified binary (gitleaks-action needs a paid licence on org repos).
    # Pull request: only the commits the PR adds. Push: the full history of every ref in the clone.
    # Fails on any finding not allowlisted in .gitleaks.toml; the redacted SARIF is uploaded either way.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan (PR commits, or full history on push)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="${BASE_SHA}..${HEAD_SHA}"; else range="--all"; fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --config .gitleaks.toml --redact --no-banner \
            --exit-code 1 --report-format sarif --report-path gitleaks.sarif

      - name: Upload redacted SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30
