# tasksmate-python CI (task 4.5 Part E). Every job runs offline except `integration`, which runs only when the
# TASKSMATE_TOKEN secret exists. Nothing here publishes anything (that is release.yml, and PyPI is gated on S.23).
# 5.3: + the two stdio MCP proxies in packages/ — `tasksmate-mcp` (Python, `uvx`) and `@tasksmate/mcp` (Node, `npx`).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      # src/tasksmate/_generated is excluded (pyproject [tool.mypy]): generated code is its generator's to type-check;
      # every call into it is typed at the facade's boundary.
      - run: mypy

  test:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest   # respx-mocked; `integration` tests are deselected (pyproject addopts)

  regen:
    name: regenerate from spec/openapi.public.json (fails on drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/generate.py
      - name: The committed code is what the committed spec generates
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  mcp-python:
    name: tasksmate-mcp — ruff, mypy, pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/tasksmate-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest   # a stdio client → the proxy → a fake Streamable HTTP server, in memory; plus the real process

  mcp-node:
    name: "@tasksmate/mcp — typecheck, vitest, npm pack (node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: packages/mcp-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/mcp-node/package-lock.json
      - run: npm ci
      - run: npm run check   # tsc --noEmit, build + vitest, npm pack --dry-run
      - run: npm audit --audit-level=moderate

  audit:
    name: pip-audit (runtime + extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --upgrade pip pip-audit
          /tmp/audit/bin/pip install ".[cli,pandas]"
          # tasksmate itself is not on PyPI (yet): audit everything it pulls in, pinned as installed
          /tmp/audit/bin/pip freeze --exclude tasksmate --exclude pip-audit > /tmp/audit-requirements.txt
          /tmp/audit/bin/pip-audit --strict --desc=off -r /tmp/audit-requirements.txt
      - name: tasksmate-mcp's dependencies (mcp, httpx and what they pull in)
        run: |
          python -m venv /tmp/audit-mcp
          /tmp/audit-mcp/bin/pip install --upgrade pip pip-audit
          /tmp/audit-mcp/bin/pip install ./packages/tasksmate-mcp
          /tmp/audit-mcp/bin/pip freeze --exclude tasksmate-mcp --exclude pip-audit > /tmp/audit-mcp-requirements.txt
          /tmp/audit-mcp/bin/pip-audit --strict --desc=off -r /tmp/audit-mcp-requirements.txt

  build:
    name: build + twine check + SBOM (tasksmate, tasksmate-mcp, @tasksmate/mcp)
    runs-on: ubuntu-latest
    needs: [lint, test, regen, mcp-python, mcp-node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install build twine cyclonedx-bom
      - run: python -m build
      - run: python -m build packages/tasksmate-mcp --outdir dist/
      - run: twine check --strict dist/*
      - name: CycloneDX SBOM of each installed wheel (S.2)
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install dist/tasksmate-*.whl   # tasksmate's wheel; tasksmate-mcp's is tasksmate_mcp-*.whl
          cyclonedx-py environment /tmp/sbom/bin/python --of JSON -o dist/sbom.cdx.json
          python -m venv /tmp/sbom-mcp
          /tmp/sbom-mcp/bin/pip install dist/tasksmate_mcp-*.whl
          cyclonedx-py environment /tmp/sbom-mcp/bin/python --of JSON -o dist/sbom-tasksmate-mcp.cdx.json
      - name: npm pack + SBOM (@tasksmate/mcp; nothing is published)
        working-directory: packages/mcp-node
        run: |
          npm ci
          npm pack --pack-destination ../../dist
          npx --yes @cyclonedx/cyclonedx-npm@6 --omit dev --output-format JSON --output-file ../../dist/sbom-mcp-node.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  integration:
    name: quickstart against a live API (skipped without the secret)
    runs-on: ubuntu-latest
    needs: [test]
    env:
      TASKSMATE_TOKEN: ${{ secrets.TASKSMATE_TOKEN }}
      TASKSMATE_API_URL: ${{ vars.TASKSMATE_API_URL }}
      TASKSMATE_ORG: ${{ vars.TASKSMATE_ORG }}
    steps:
      - name: Skip when no token is configured
        if: env.TASKSMATE_TOKEN == ''
        run: echo "TASKSMATE_TOKEN is not set for this repository — the integration job is skipped."
      - uses: actions/checkout@v4
        if: env.TASKSMATE_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.TASKSMATE_TOKEN != ''
        with:
          python-version: "3.12"
      - if: env.TASKSMATE_TOKEN != ''
        run: pip install -e ".[dev]"
      - if: env.TASKSMATE_TOKEN != ''
        run: pytest -m integration -o addopts="" -v

  secrets:
    name: secrets
    # S.1: gitleaks, a pinned and checksum-verified binary (gitleaks-action needs a paid licence on org repos).
    # Pull request: only the commits the PR adds. Push: the full history of every ref in the clone.
    # Fails on any finding not allowlisted in .gitleaks.toml; the redacted SARIF is uploaded either way.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan (PR commits, or full history on push)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="${BASE_SHA}..${HEAD_SHA}"; else range="--all"; fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --config .gitleaks.toml --redact --no-banner \
            --exit-code 1 --report-format sarif --report-path gitleaks.sarif

      - name: Upload redacted SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30
