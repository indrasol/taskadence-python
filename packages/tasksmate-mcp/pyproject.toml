[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# A second distribution in the tasksmate-python repo (task 5.3): the stdio ↔ Streamable HTTP proxy to the remote
# TasksMate MCP server. Its own package — not a `[mcp]` extra of `tasksmate` — because `uvx <name>` runs the script
# named like the package: `uvx tasksmate-mcp` works; an extra would need `uvx --from "tasksmate[mcp]" tasksmate-mcp`.
[project]
name = "tasksmate-mcp"
dynamic = ["version"]
description = "TasksMate's MCP server for clients that start a local process: a stdio proxy to the remote server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Indrasol" }]
keywords = ["tasksmate", "mcp", "model context protocol", "claude", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "starlette>=0.40", "ruff==0.16.9", "mypy>=1.11,<2.4", "build>=1.2", "twine>=5", "pip-audit>=2.7"]

[project.scripts]
tasksmate-mcp = "tasksmate_mcp.cli:main"

[project.urls]
Homepage = "https://developers.tasksmate.indrasol.com/mcp/connect/"
Source = "https://github.com/indrasol/tasksmate-python/tree/main/packages/tasksmate-mcp"

[tool.hatch.version]
path = "src/tasksmate_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tasksmate_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/tasksmate_mcp", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/tasksmate_mcp"]
